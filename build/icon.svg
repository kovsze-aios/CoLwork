<svg width="512" height="512" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cw-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="1" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.55" />
    </linearGradient>
    <radialGradient id="cw-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background tile (so the icon reads on light & dark surfaces) -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#09090b" />
  <circle cx="32" cy="32" r="30" fill="url(#cw-glow)" />

  <!-- Neural edges -->
  <g stroke="url(#cw-grad)" stroke-width="1.6" stroke-linecap="round">
    <line x1="14" y1="18" x2="32" y2="32" />
    <line x1="14" y1="32" x2="32" y2="32" />
    <line x1="14" y1="46" x2="32" y2="32" />
    <line x1="32" y1="32" x2="50" y2="22" />
    <line x1="32" y1="32" x2="50" y2="42" />
  </g>

  <!-- Agent nodes -->
  <g fill="#0A66C2">
    <circle cx="14" cy="18" r="3" />
    <circle cx="14" cy="32" r="3" />
    <circle cx="14" cy="46" r="3" />
    <circle cx="50" cy="22" r="3" />
    <circle cx="50" cy="42" r="3" />
  </g>

  <!-- Central MoE hub -->
  <circle cx="32" cy="32" r="5" fill="#09090b" stroke="#0A66C2" stroke-width="2" />
  <circle cx="32" cy="32" r="1.6" fill="#0A66C2" />

  <!-- Terminal chevron + caret -->
  <g stroke="#e4e4e7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="42,52 47,57 42,62" />
    <line x1="50" y1="62" x2="56" y2="62" />
  </g>
</svg>
